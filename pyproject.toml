[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glinker"
version = "0.1.1"
description = "GLiNKER - A modular multi-layer entity linking framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Knowledgator", email = "info@knowledgator.com"}
]
keywords = ["entity-linking", "nlp", "gliner", "spacy", "ner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "spacy>=3.7.0",
    "gliner>=0.2.5",
    "torch>=2.0.0",
    "redis>=5.0.0",
    "elasticsearch>=8.11.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.65.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
demo = [
    "gradio>=4.0.0",
]
all = [
    "glinker[dev,demo]",
]

[project.urls]
Homepage = "https://github.com/Knowledgator/GLinker"
Repository = "https://github.com/Knowledgator/GLinker"
Documentation = "https://github.com/Knowledgator/GLinker/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["glinker*"]

[tool.setuptools.package-data]
glinker = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ARG",    # unused arguments
    "T20",    # print statements
    "C4",     # comprehensions
    "EM",     # errmsg
    "PL",     # Pylint
    "RUF"     # Ruff-specific rules
]

ignore = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in `__init__`
    "D200",   # One-line docstring should fit on one line
    "D205",   # Blank line required between summary and description
    "D212",   # Multi-line docstring summary should start at the first line
    "D400",   # First line should end with a period
    "D401",   # First line should be in imperative mood
    "D417",   # Missing argument descriptions
    "RUF012", # Mutable class attributes should be annotated
    "PLR0913",# Too many arguments
    "PLR0912",# Too many branches
    "PLR0915",# Too many statements
    "PLR2004",# Magic value used in comparison
    "PLW2901",# Loop variable overwritten
    "B006",   # Mutable defaults
    "B027",   # Empty method without abstract decorator
    "B904",   # Raise without from inside except
    "S101",   # Use of `assert` detected
    "SIM102", # Collapsible if statements
    "SIM105", # Use contextlib.suppress instead of try-except-pass
    "SIM108", # Use ternary operator
    "UP035",  # Deprecated typing imports
    "UP006",  # Deprecated typing imports
    "EM101",  # Exception message formatting
    "EM102",  # Exception message formatting
    "ARG002", # Unused method arguments
    "B905",   # zip() without explicit strict= parameter
    "E402",   # Module level import not at top (for conditional imports)
    "E501",   # Line too long (handled by formatter)
    "E722",   # Bare except (intentional for fallback logic)
    "E741",   # Ambiguous variable name (short names in comprehensions)
    "PLC0206",# Extracting value from dictionary without .items()
    "PLC0415",# Import should be at top-level (for dynamic imports)
    "T201",   # Print statements (used for debugging)
]

unfixable = [
    "T201",   # Print statements
    "T203",   # pprint statements
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # Unused imports in __init__.py are often intentional
    "F403",  # Star imports in __init__.py
]
"tests/**/*.py" = [
    "D",      # No docstring requirements in tests
    "ARG",    # Unused arguments are common in test fixtures
    "PLR2004",# Magic values are fine in tests
    "S101",   # Assert is expected in tests
]

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true
combine-as-imports = true
known-first-party = ["glinker"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 15
max-returns = 8
max-statements = 60

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=glinker --cov-report=term-missing"
